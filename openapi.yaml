openapi: 3.0.3
info:
  title: API Aux Claviers Citoyens (ACC)
  version: 2.2.0
  description: |-
    Contrat d'API de gestion des tournois e-sport — transcrit du *Cahier des charges développement v2.2* (CND).

    Chaque opération reprend la **Description**, l'**Entrée**, la **Sortie** et l'éventuel **Effet de bord** du cahier des charges.

    **Authentification (§3.B)** : l'API est en consultation libre ; les opérations de création, modification et suppression sont réservées aux utilisateurs connectés. L'authentification repose sur des jetons de session : la première consultation de l'API crée une session, et l'authentification y est stockée (cookie de session).
servers:
- url: http://localhost:8080
  description: Serveur local de développement
tags:
- name: 1. Authentification
- name: 2. Gestion des utilisateurs
- name: 3. Gestion du tournoi
- name: 4. Gestion des équipes
- name: 5. Gestion des joueurs
- name: 6. Gestion des jeux
- name: 7. Gestion des matchs et des rounds
paths:
  /auth/login:
    post:
      tags:
      - 1. Authentification
      summary: User login
      operationId: login
      description: |
        **Description :** C'est la fonction classique de connexion. Elle vérifie que votre e-mail et votre mot de passe sont corrects pour vous laisser entrer dans le système.

        **Entrée :** votre adresse e-mail et votre mot de passe personnel.

        **Sortie :** `200 OK` si réussi, `401 Unauthorized` sinon.

        **Effet de bord :** la session doit maintenant contenir votre authentification ; votre jeton d'authentification est donc votre cookie de session.

        🔓 **Accès :** consultation libre — cf. CDC §3.B.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
              - email
              - password
      responses:
        '200':
          description: OK — connexion réussie
          headers:
            Set-Cookie:
              description: Cookie de session contenant désormais l'authentification (jeton d'authentification)
              schema:
                type: string
                example: SESSIONID=abc123; Path=/; HttpOnly; SameSite=Lax
        '401':
          description: Unauthorized — identifiants invalides
  /auth/register:
    post:
      tags:
      - 1. Authentification
      summary: Register a new user
      operationId: registerUser
      description: |
        **Description :** C'est la fonction d'inscription. Elle crée votre nouveau compte dans le système.

        **Entrée :** votre adresse e-mail et le mot de passe que vous souhaitez utiliser.

        **Sortie :** `201 Created` si réussi, `401 Unauthorized` sinon.

        **Effet de bord :** la session doit maintenant contenir votre authentification ; votre jeton d'authentification est donc votre cookie de session.

        🔓 **Accès :** consultation libre — cf. CDC §3.B.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 48
              required:
              - email
              - password
      responses:
        '201':
          description: Created — compte créé et authentifié dans la session
          headers:
            Set-Cookie:
              description: Cookie de session contenant désormais l'authentification (jeton d'authentification)
              schema:
                type: string
                example: SESSIONID=abc123; Path=/; HttpOnly; SameSite=Lax
        '401':
          description: Unauthorized — échec de l'inscription
  /auth/me:
    get:
      tags:
      - 1. Authentification
      summary: Get the current authenticated user
      operationId: getCurrentUser
      description: |
        **Description :** Permet de savoir qui vous êtes (votre profil) en tant qu'utilisateur actuellement connecté.

        **Entrée :** le cookie de session.

        **Sortie :** vos informations publiques : votre identifiant unique, votre e-mail et votre nom (s'il existe).

        🔒 **Accès :** nécessite le cookie de session.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Profil de l'utilisateur connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}:
    get:
      tags:
      - 2. Gestion des utilisateurs
      summary: Get a user by id
      operationId: getUserById
      description: |
        **Description :** Récupère les informations d'un autre utilisateur en connaissant son numéro d'identification unique.

        **Entrée :** le numéro d'identification (ID) de l'utilisateur recherché.

        **Sortie :** les informations publiques de l'utilisateur (ID, e-mail, nom).

        🔓 **Accès :** consultation libre — cf. CDC §3.B.
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - 2. Gestion des utilisateurs
      summary: Update user details
      operationId: updateUser
      description: |
        **Description :** Permet de modifier vos informations personnelles, comme votre e-mail ou votre nom d'affichage.

        **Entrée :** le numéro d'identification (ID) de votre compte, et les nouvelles informations que vous souhaitez modifier (votre nouvel e-mail ou nom).

        **Sortie :** vos informations publiques mises à jour (ID, e-mail, nom).

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
      responses:
        '200':
          description: Informations mises à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}/password:
    put:
      tags:
      - 2. Gestion des utilisateurs
      summary: Update user password
      operationId: updateUserPassword
      description: |
        **Description :** Permet de changer votre mot de passe actuel.

        **Entrée :** le numéro d'identification (ID) de votre compte et votre nouveau mot de passe (qui doit avoir entre 8 et 48 caractères).

        **Sortie :** un message de succès confirmant que la mise à jour a été effectuée.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 48
              required:
              - newPassword
      responses:
        '200':
          description: Mot de passe mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tournaments:
    get:
      tags:
      - 3. Gestion du tournoi
      summary: List tournaments
      operationId: listTournaments
      description: |
        **Description :** Donne la liste complète de tous les tournois disponibles dans le système.

        **Entrée :** aucune.

        **Sortie :** une liste d'objets contenant pour chaque tournoi : son ID, son nom, le jeu pratiqué et son état actuel.

        🔓 **Accès :** consultation libre — cf. CDC §3.B.
      security: []
      responses:
        '200':
          description: Liste des tournois
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tournament'
    post:
      tags:
      - 3. Gestion du tournoi
      summary: Create a tournament
      operationId: createTournament
      description: |
        **Description :** Permet de créer et d'organiser un nouveau tournoi.

        **Entrée :** le nom du tournoi, le jeu concerné, et le nombre d'équipes qui participeront (au moins 2).

        **Sortie :** les détails du tournoi qui vient d'être créé.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                gameId:
                  type: string
                  format: uuid
                maxTeams:
                  type: integer
                  minimum: 2
                startDate:
                  type: string
                  pattern: ^(0[1-9]|[12]\d|3[01])/(0[1-9]|1[0-2])/\d{4}$
                  description: Format DD/MM/YYYY (CDC §3.A)
                  example: 15/07/2026
                endDate:
                  type: string
                  pattern: ^(0[1-9]|[12]\d|3[01])/(0[1-9]|1[0-2])/\d{4}$
                  description: Format DD/MM/YYYY (CDC §3.A)
                  example: 15/07/2026
              required:
              - name
              - gameId
              - maxTeams
      responses:
        '201':
          description: Created — tournoi créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tournaments/{id}:
    get:
      tags:
      - 3. Gestion du tournoi
      summary: Get a tournament
      operationId: getTournament
      description: |
        **Description :** Affiche les détails précis d'un tournoi en particulier.

        **Entrée :** le numéro d'identification (ID) du tournoi.

        **Sortie :** les détails du tournoi.

        🔓 **Accès :** consultation libre — cf. CDC §3.B.
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Détails du tournoi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - 3. Gestion du tournoi
      summary: Update a tournament
      operationId: updateTournament
      description: |
        **Description :** Permet à l'organisateur de modifier les informations du tournoi (nom, jeu ou statut).

        **Entrée :** le numéro d'identification (ID) du tournoi, et les informations à modifier (nom, jeu ou statut).

        **Sortie :** les détails du tournoi mis à jour.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                gameId:
                  type: string
                  format: uuid
                status:
                  type: boolean
      responses:
        '200':
          description: Tournoi mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - 3. Gestion du tournoi
      summary: Delete a tournament
      operationId: deleteTournament
      description: |
        **Description :** Permet de supprimer définitivement un tournoi du système.

        **Entrée :** le numéro d'identification (ID) du tournoi.

        **Sortie :** un message de succès confirmant la suppression.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tournoi supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tournaments/{tournamentId}/teams:
    get:
      tags:
      - 4. Gestion des équipes
      summary: List teams for a tournament
      operationId: listTeams
      description: |
        **Description :** Donne la liste des équipes inscrites à un tournoi donné.

        **Entrée :** le numéro d'identification (ID) du tournoi.

        **Sortie :** une liste d'objets avec les détails de chaque équipe.

        🔓 **Accès :** consultation libre — cf. CDC §3.B.
      security: []
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Équipes du tournoi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - 4. Gestion des équipes
      summary: Create a team in a tournament
      operationId: createTeam
      description: |
        **Description :** Permet d'inscrire une nouvelle équipe dans un tournoi.

        **Entrée :** le numéro d'identification (ID) du tournoi, l'URL d'image et le nom de la nouvelle équipe.

        **Sortie :** les détails de l'équipe qui vient d'être créée.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                imageUrl:
                  type: string
                  format: uri
              required:
              - name
              - imageUrl
      responses:
        '201':
          description: Created — équipe créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tournaments/{tournamentId}/teams/{teamId}:
    get:
      tags:
      - 4. Gestion des équipes
      summary: Find a team
      operationId: getTeam
      description: |
        **Description :** Affiche les détails précis d'une équipe dans un tournoi.

        **Entrée :** l'ID de l'équipe et l'ID du tournoi.

        **Sortie :** les détails de l'équipe.

        🔓 **Accès :** consultation libre — cf. CDC §3.B.
      security: []
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Détails de l'équipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - 4. Gestion des équipes
      summary: Update a team in a tournament
      operationId: updateTeam
      description: |
        **Description :** Permet de changer le nom d'une équipe dans un tournoi.

        **Entrée :** le numéro d'identification (ID) du tournoi, l'ID de l'équipe, et le nouveau nom (optionnel).

        **Sortie :** les détails de l'équipe mise à jour.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Équipe mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - 4. Gestion des équipes
      summary: Remove a team from a tournament
      operationId: deleteTeam
      description: |
        **Description :** Permet de retirer une équipe d'un tournoi.

        **Entrée :** le numéro d'identification (ID) du tournoi et l'ID de l'équipe.

        **Sortie :** un message de succès confirmant la suppression.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Équipe retirée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tournaments/{tournamentId}/teams/{teamId}/players:
    post:
      tags:
      - 4. Gestion des équipes
      summary: Add a player to a team
      operationId: addPlayerToTeam
      description: |
        **Description :** Permet d'ajouter un·e athlète à une équipe.

        **Entrée :** l'ID de l'athlète, l'ID du tournoi et l'ID de l'équipe.

        **Sortie :** l'équipe avec sa liste des joueurs mise à jour.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playerId:
                  type: string
                  format: uuid
              required:
              - playerId
      responses:
        '200':
          description: Équipe mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tournaments/{tournamentId}/teams/{teamId}/players/{playerId}:
    delete:
      tags:
      - 4. Gestion des équipes
      summary: Remove a player from a team
      operationId: removePlayerFromTeam
      description: |
        **Description :** Permet de retirer un·e athlète d'une équipe.

        **Entrée :** l'ID de l'athlète, l'ID du tournoi et l'ID de l'équipe.

        **Sortie :** l'équipe avec sa liste des joueurs mise à jour.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Équipe mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /players:
    get:
      tags:
      - 5. Gestion des joueurs
      summary: List players
      operationId: listPlayers
      description: |
        **Description :** Donne la liste complète de tous les joueurs présent·e·s dans le système.

        **Entrée :** aucune.

        **Sortie :** une liste d'objets représentant chaque athlète et contenant leurs informations.

        🔓 **Accès :** consultation libre — cf. CDC §3.B.
      security: []
      responses:
        '200':
          description: Liste des joueurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Player'
    post:
      tags:
      - 5. Gestion des joueurs
      summary: Create a player
      operationId: createPlayer
      description: |
        **Description :** Permet de créer un nouvel athlète.

        **Entrée :** le tagname de l'athlète.

        **Sortie :** `201 Created` avec les données de l'athlète créé·e, erreur sinon.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tagname:
                  type: string
                avatarUrl:
                  type: string
                  format: uri
              required:
              - tagname
      responses:
        '201':
          description: Created — joueur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /players/{id}:
    get:
      tags:
      - 5. Gestion des joueurs
      summary: Get a player
      operationId: getPlayer
      description: |
        **Description :** Affiche les détails précis d'un·e athlète.

        **Entrée :** l'ID de l'athlète.

        **Sortie :** les détails de l'athlète.

        🔓 **Accès :** consultation libre — cf. CDC §3.B.
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Détails du joueur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - 5. Gestion des joueurs
      summary: Update a player
      operationId: updatePlayer
      description: |
        **Description :** Permet de modifier les données d'un·e athlète.

        **Entrée :** l'ID de l'athlète et les informations à mettre à jour.

        **Sortie :** les détails de l'athlète mis à jour.

        🔒 **Accès :** réservé aux utilisateurs connectés (cookie de session) — cf. CDC §3.B.
      security:
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
