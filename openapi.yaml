components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSIONID
      description: Cookie de session posé par /auth/login ou /auth/register. Adapter le nom au framework (JSESSIONID, PHPSESSID…).
  responses:
    Unauthorized:
      description: Unauthorized — opération réservée aux utilisateurs connectés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found — ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad Request — données invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
          example: Opération effectuée avec succès
      required:
      - message
    Error:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
      required:
      - id
      - email
    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: League of Legends
        imageUrl:
          type: string
          format: uri
      required:
      - id
      - title
      - imageUrl
    Tournament:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: boolean
          description: Actif (true) ou inactif (false)
        startDate:
          type: string
          pattern: ^(0[1-9]|[12]\d|3[01])/(0[1-9]|1[0-2])/\d{4}$
          description: Format DD/MM/YYYY (CDC §3.A)
          example: 15/07/2026
        endDate:
          type: string
          pattern: ^(0[1-9]|[12]\d|3[01])/(0[1-9]|1[0-2])/\d{4}$
          description: Format DD/MM/YYYY (CDC §3.A)
          example: 15/07/2026
        maxTeams:
          type: integer
          minimum: 2
        game:
          $ref: '#/components/schemas/Game'
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/Round'
      required:
      - id
      - name
      - status
      - game
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        imageUrl:
          type: string
          format: uri
        points:
          type: integer
          description: Points remportés lors du tournoi (≠ score d'un match) — CDC §1
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
      required:
      - id
      - name
      - imageUrl
      - points
      - players
    Player:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tagname:
          type: string
          example: DragonSlayer
        avatarUrl:
          type: string
          format: uri
        teamIds:
          type: array
          items:
            type: string
            format: uuid
          description: Équipes d'appartenance (CDC §3.A)
      required:
      - id
      - tagname
    Round:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roundNumber:
          type: integer
          minimum: 1
        tournamentId:
          type: string
          format: uuid
        matchIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - id
      - roundNumber
      - tournamentId
      - matchIds
    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        matchNumber:
          type: integer
        roundId:
          type: string
          format: uuid
        scores:
          type: array
          items:
            type: object
            properties:
              teamId:
                type: string
                format: uuid
              score:
                type: integer
            required:
            - teamId
            - score
      required:
      - id
      - matchNumber
      - roundId
      - scores
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: Pentakill
        points:
          type: integer
          example: 1
        gameId:
          type: string
          format: uuid
      required:
      - id
      - label
      - points
      - gameId
      description: Évènement rapportant des points, spécifique à un jeu (CDC §1 et §3.A). Aucun endpoint n'est prévu au contrat
        d'API.